<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>蕭貪島大冒險</title>
<style>
  :root{ --ink:#3D2C4A; --ink-soft:#6B5878; --panel:#FFFFFF; --purple:#B18AE8; --shadow:0 10px 0 rgba(61,44,74,.18), 0 18px 40px rgba(61,44,74,.22); }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;font-family:"Baloo 2","Nunito","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
  body{background:linear-gradient(#a7e0ff,#d9f4ff);display:flex;align-items:center;justify-content:center}
  #app{position:relative;width:100%;height:100%;max-width:920px;max-height:560px;margin:auto}
  canvas#game{display:block;width:100%;height:100%;background:#8ED6FF}

  /* 選角 */
  #pick{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;
    background:radial-gradient(120% 80% at 50% -10%, #fff8, transparent 60%),linear-gradient(#9adcff,#c9f0ff 55%,#bde89a 55%,#a6de84);
    padding:16px;text-align:center;overflow-y:auto}
  #pick h1{margin:0;color:var(--ink);font-size:clamp(23px,6vw,40px);font-weight:800;letter-spacing:1px;text-shadow:0 3px 0 #fff,0 6px 0 rgba(61,44,74,.15)}
  #pick .sub{margin:-4px 0 0;color:var(--ink-soft);font-weight:700;font-size:14px}
  #continueBox{display:none;background:#fff;border-radius:18px;padding:9px 14px;box-shadow:var(--shadow);align-items:center;gap:12px}
  #continueBox .ct{text-align:left}
  #continueBox .ct b{color:var(--ink);font-size:15px}
  #continueBox .ct div{color:var(--ink-soft);font-size:12px;font-weight:700}
  #continueBtn{border:none;cursor:pointer;font-family:inherit;font-weight:800;color:#fff;font-size:15px;padding:10px 20px;border-radius:14px;background:linear-gradient(#8fe0a0,#4fc06a);box-shadow:0 5px 0 #2f9a4a}
  #continueBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #2f9a4a}
  .newlbl{color:var(--ink-soft);font-weight:800;font-size:13px;margin-top:2px}
  .cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:820px}
  .hero-card{width:156px;background:var(--panel);border-radius:20px;padding:8px 10px 12px;cursor:pointer;border:4px solid #fff;box-shadow:var(--shadow);transition:transform .16s cubic-bezier(.2,1.4,.4,1),box-shadow .16s;position:relative;overflow:hidden}
  .hero-card::before{content:"";position:absolute;inset:0 0 auto 0;height:60px;opacity:.35;background:radial-gradient(80% 120% at 50% 0,var(--c),transparent 70%)}
  .hero-card:hover{transform:translateY(-7px) rotate(-1deg)}
  .hero-card.sel{transform:translateY(-7px) scale(1.03);border-color:var(--c);box-shadow:0 0 0 4px #fff,0 14px 0 rgba(61,44,74,.18),0 22px 44px var(--c)}
  .hero-card canvas{width:92px;height:92px;margin:0 auto;background:transparent;display:block}
  .hero-card .nm{font-weight:800;color:var(--ink);font-size:16px}
  .hero-card .role{display:inline-block;margin:2px 0 5px;padding:2px 11px;border-radius:999px;font-size:11px;font-weight:800;color:#fff;background:var(--c)}
  .hero-card .desc{font-size:11px;line-height:1.4;color:var(--ink-soft);min-height:44px}
  .hero-card .ult{font-size:10.5px;font-weight:800;color:var(--c);margin-top:4px}
  .hero-card .stats{display:flex;justify-content:center;gap:5px;margin-top:6px}
  .pip{width:22px;height:6px;border-radius:99px;background:#eadff0}
  .pip.on{background:var(--c)}
  .pickRow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  .nameRow{display:flex;gap:8px;align-items:center;background:#fff;padding:8px 10px;border-radius:16px;box-shadow:0 6px 0 rgba(61,44,74,.12)}
  .nameRow label{font-weight:800;color:var(--ink-soft);font-size:14px}
  #heroName{border:2px solid #eadff0;border-radius:10px;padding:8px 12px;font-size:15px;font-family:inherit;font-weight:700;color:var(--ink);width:130px;outline:none}
  #heroName:focus{border-color:var(--purple)}
  #dressPickBtn{border:none;cursor:pointer;font-family:inherit;font-weight:800;color:#fff;font-size:15px;padding:11px 20px;border-radius:16px;background:linear-gradient(#f7a8d8,#e070b8);box-shadow:0 6px 0 #b84e94}
  #dressPickBtn:active{transform:translateY(3px);box-shadow:0 3px 0 #b84e94}
  #dressPickBtn:disabled{filter:grayscale(.6) opacity(.6);cursor:not-allowed;box-shadow:0 6px 0 #999}
  .startbtn{border:none;cursor:pointer;font-family:inherit;font-weight:800;color:#fff;font-size:18px;padding:11px 40px;border-radius:999px;background:linear-gradient(#ffd23f,#ff9f1c);box-shadow:0 6px 0 #d97e00,0 12px 22px rgba(217,126,0,.5);transition:transform .08s}
  .startbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #d97e00}
  .startbtn:disabled{filter:grayscale(.6) opacity(.6);cursor:not-allowed;box-shadow:0 6px 0 #999}

  /* HUD */
  #hud{position:absolute;left:14px;top:12px;display:none;gap:10px;align-items:flex-start;pointer-events:none}
  .badge{background:#fff;border:3px solid #fff;border-radius:16px;padding:6px 10px;box-shadow:0 5px 0 rgba(61,44,74,.15);display:flex;align-items:center;gap:8px}
  .lvl{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px;flex-direction:column;line-height:1;background:var(--purple)}
  .lvl small{font-size:8px;font-weight:700;opacity:.9}
  .who{display:flex;flex-direction:column;gap:4px}
  .who .pn{font-weight:800;color:var(--ink);font-size:13px;line-height:1;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bars{display:flex;flex-direction:column;gap:4px}
  .bar{width:150px;height:11px;background:#eadff0;border-radius:99px;overflow:hidden;position:relative}
  .bar i{display:block;height:100%;width:100%;border-radius:99px;transition:width .15s}
  .bar.hp i{background:linear-gradient(#ff8fb1,#ff5f7e)}
  .bar.mp i{background:linear-gradient(#7ad0ff,#3b9bff)}
  .bar.xp i{background:linear-gradient(#ffe27a,#ffc738)}
  .bar span{position:absolute;inset:0;font-size:8.5px;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 1px rgba(0,0,0,.35)}
  #topright{position:absolute;right:14px;top:12px;display:none;flex-direction:column;gap:7px;align-items:flex-end}
  .rowr{display:flex;gap:7px}
  .chip{background:#fff;border-radius:16px;padding:5px 12px;font-weight:800;color:var(--ink);box-shadow:0 5px 0 rgba(61,44,74,.15);font-size:13px}
  .chip.gold{color:#b8860b}
  .chip.stage{color:#7a5fb0}
  .iconbtn{pointer-events:auto;cursor:pointer;border:none;font-family:inherit;font-weight:800;font-size:15px;padding:6px 11px;border-radius:14px;box-shadow:0 5px 0 rgba(61,44,74,.2);color:#fff}
  #shopBtn{background:linear-gradient(#8fe0a0,#4fc06a);box-shadow:0 5px 0 #2f9a4a}
  #dressBtn{background:linear-gradient(#f7a8d8,#e070b8);box-shadow:0 5px 0 #b84e94}
  #muteBtn{background:linear-gradient(#c39bf0,#9a5fe0);box-shadow:0 5px 0 #6f3fb8}
  .iconbtn:active{transform:translateY(3px)}

  /* 觸控 */
  #touch{position:absolute;inset:auto 0 0 0;height:130px;display:none;justify-content:space-between;align-items:flex-end;padding:12px 16px;pointer-events:none}
  .tpad{display:flex;gap:10px;pointer-events:auto;align-items:flex-end}
  .tbtn{width:56px;height:56px;border-radius:50%;background:#ffffffcc;border:3px solid #fff;box-shadow:0 5px 0 rgba(61,44,74,.2);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:var(--ink);user-select:none;touch-action:none}
  .tbtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(61,44,74,.2)}
  .tbtn.big{width:68px;height:68px;background:linear-gradient(#ffd23f,#ff9f1c);color:#fff}
  .tbtn.ult{width:62px;height:62px;background:linear-gradient(#c39bf0,#9a5fe0);color:#fff;font-size:26px}

  /* 通用彈窗面板 */
  .overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(61,44,74,.5);backdrop-filter:blur(4px);padding:14px}
  .panel{background:var(--panel);border-radius:24px;padding:16px 18px;width:min(540px,96%);box-shadow:var(--shadow);max-height:95%;overflow-y:auto}
  .panel h2{margin:0 0 8px;color:var(--ink);font-size:23px;text-align:center}
  .goldline{text-align:center;font-weight:800;color:#b8860b;margin-bottom:10px}
  .shop-item{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:16px;background:#fbf7ff;margin-bottom:8px;border:2px solid #f0e8fa}
  .shop-item .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;background:#fff;flex-shrink:0;box-shadow:0 3px 0 rgba(61,44,74,.1)}
  .shop-item .info{flex:1;text-align:left}
  .shop-item .info b{color:var(--ink);font-size:15px}
  .shop-item .info div{color:var(--ink-soft);font-size:12px;font-weight:600}
  .buy{border:none;cursor:pointer;font-family:inherit;font-weight:800;color:#fff;font-size:13px;padding:9px 13px;border-radius:12px;background:linear-gradient(#ffd23f,#ff9f1c);box-shadow:0 4px 0 #d97e00;white-space:nowrap}
  .buy:active{transform:translateY(2px)}
  .buy:disabled{filter:grayscale(.7) opacity(.55);cursor:not-allowed}
  .closebtn{border:none;cursor:pointer;font-family:inherit;font-weight:800;color:#fff;font-size:16px;padding:10px 36px;border-radius:999px;background:linear-gradient(#8fe0a0,#4fc06a);box-shadow:0 6px 0 #2f9a4a;margin-top:4px}
  .closebtn:active{transform:translateY(3px);box-shadow:0 3px 0 #2f9a4a}

  /* 裝扮台 */
  #dressPreviewWrap{display:flex;justify-content:center;margin-bottom:6px}
  #dressPreview{width:150px;height:150px;background:linear-gradient(#eaf6ff,#d5eaff);border-radius:20px;box-shadow:inset 0 3px 10px rgba(61,44,74,.1)}
  .dress-tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
  .dtab{cursor:pointer;font-weight:800;font-size:13px;padding:6px 13px;border-radius:11px;background:#f0e8fa;color:var(--ink-soft);border:2px solid transparent}
  .dtab.on{background:linear-gradient(#f7a8d8,#e070b8);color:#fff}
  #dressOptions{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;min-height:70px;margin-bottom:8px}
  .swatch{width:44px;height:44px;border-radius:50%;cursor:pointer;border:3px solid #fff;box-shadow:0 3px 0 rgba(61,44,74,.15);position:relative}
  .swatch.on{border-color:#e070b8;box-shadow:0 0 0 3px #fff,0 3px 0 #e070b8}
  .opt{cursor:pointer;background:#fbf7ff;border:2px solid #f0e8fa;border-radius:14px;padding:8px 6px 6px;width:74px;text-align:center;position:relative}
  .opt.on{border-color:#e070b8;background:#fff0f8}
  .opt .oi{font-size:24px;line-height:1}
  .opt .on-nm{font-size:11px;font-weight:800;color:var(--ink);margin-top:2px}
  .opt .price{font-size:10px;font-weight:800;color:#b8860b}
  .opt .price.own{color:#4f9a4a}
  .opt.locked{opacity:.55}
  .opt .bonus{font-size:9px;font-weight:700;color:#9a5fe0}

  /* 提示/結束 */
  #toast{position:absolute;left:50%;top:24%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;font-weight:800;color:#fff;font-size:30px;text-shadow:0 3px 0 #d97e00,0 0 18px #ffd23f;transition:transform .3s cubic-bezier(.2,1.6,.4,1),opacity .3s;text-align:center;width:90%}
  #toast.show{transform:translate(-50%,-50%) scale(1);opacity:1}
  #bossbar{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:min(420px,80%);display:none;flex-direction:column;align-items:center;gap:3px;pointer-events:none}
  #bossbar .bn{font-weight:800;color:#fff;font-size:13px;text-shadow:0 2px 2px rgba(0,0,0,.4)}
  #bossbar .bb{width:100%;height:14px;background:rgba(61,44,74,.55);border-radius:99px;overflow:hidden;border:2px solid #fff}
  #bossbar .bb i{display:block;height:100%;background:linear-gradient(#ff6b6b,#c0392b);transition:width .2s}
  #over{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(61,44,74,.55);backdrop-filter:blur(3px);color:#fff;text-align:center;padding:20px}
  #over h2{margin:0;font-size:34px;text-shadow:0 3px 0 rgba(0,0,0,.25)}
  #over p{margin:0;font-weight:700;opacity:.95}
  .hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);color:var(--ink-soft);font-weight:700;font-size:12px;background:#ffffffcc;padding:6px 14px;border-radius:99px;display:none;text-align:center}
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <!-- 選角 -->
  <div id="pick">
    <h1>🏝️ 蕭貪島大冒險</h1>
    <div class="sub">選夥伴 → 取名字 → 裝扮 → 出發！</div>
    <div id="continueBox">
      <div class="ct"><b id="contName">繼續冒險</b><div id="contInfo"></div></div>
      <button id="continueBtn">▶ 繼續</button>
    </div>
    <div class="newlbl" id="newlbl">— 或 開始新冒險 —</div>
    <div class="cards" id="cards"></div>
    <div class="pickRow">
      <div class="nameRow"><label>名字</label><input id="heroName" maxlength="8" placeholder="幫他取名…"></div>
      <button id="dressPickBtn" disabled>👗 裝扮</button>
    </div>
    <button class="startbtn" id="start" disabled>先選一位夥伴</button>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div class="badge">
      <div class="lvl" id="lvlBox"><small>LV</small><span id="lvlNum">1</span></div>
      <div class="who">
        <div class="pn" id="pName">夥伴</div>
        <div class="bars">
          <div class="bar hp"><i id="hpBar"></i><span id="hpTxt">100/100</span></div>
          <div class="bar mp"><i id="mpBar"></i><span id="mpTxt">MP</span></div>
          <div class="bar xp"><i id="xpBar" style="width:0"></i><span id="xpTxt">EXP 0%</span></div>
        </div>
      </div>
    </div>
  </div>
  <div id="topright">
    <div class="rowr">
      <div class="chip stage">🗺️ <b id="stageName">第一關</b></div>
      <div class="chip gold">💰 <b id="goldNum">0</b></div>
    </div>
    <div class="rowr">
      <div class="chip">🎯 <b id="killNum">0</b>/<b id="killGoal">12</b></div>
      <button id="dressBtn" class="iconbtn">👗</button>
      <button id="shopBtn" class="iconbtn">🛒</button>
      <button id="muteBtn" class="iconbtn">🔊</button>
    </div>
  </div>

  <div id="bossbar"><div class="bn" id="bossName">魔王</div><div class="bb"><i id="bossHp"></i></div></div>
  <div id="toast"></div>
  <div class="hint" id="hint">← → 移動　空白鍵 跳　J 攻擊　K 大招　B 商店　👗 裝扮</div>

  <!-- 觸控 -->
  <div id="touch">
    <div class="tpad"><div class="tbtn" data-k="left">◀</div><div class="tbtn" data-k="right">▶</div></div>
    <div class="tpad"><div class="tbtn ult" data-k="ult">✦</div><div class="tbtn big" data-k="atk">⚔</div><div class="tbtn" data-k="jump">⤒</div></div>
  </div>

  <!-- 商店 -->
  <div id="shop" class="overlay">
    <div class="panel">
      <h2>🛒 蕭貪島雜貨舖</h2>
      <div class="goldline">你的金幣：💰 <span id="shopGold">0</span></div>
      <div id="shopItems"></div>
      <div style="text-align:center"><button class="closebtn" id="closeShop">繼續冒險 ▶</button></div>
    </div>
  </div>

  <!-- 裝扮台 -->
  <div id="dress" class="overlay">
    <div class="panel">
      <h2>👗 裝扮你的夥伴</h2>
      <div id="dressPreviewWrap"><canvas id="dressPreview" width="300" height="300"></canvas></div>
      <div class="goldline" style="display:flex;align-items:center;justify-content:center;gap:12px">💰 金幣：<span id="dressGold">0</span><button id="randomDressBtn" class="buy" style="background:linear-gradient(#c39bf0,#9a5fe0);box-shadow:0 4px 0 #6f3fb8">🎲 隨機一套</button></div>
      <div class="dress-tabs" id="dressTabs"></div>
      <div id="dressOptions"></div>
      <div style="text-align:center"><button class="closebtn" id="closeDress">完成 ✓</button></div>
    </div>
  </div>

  <!-- 結束 -->
  <div id="over">
    <h2 id="overTitle">😵 倒下了…</h2>
    <p id="overStat"></p>
    <button class="startbtn" id="again">回到選單</button>
  </div>
</div>

<script>
"use strict";
/* ================= 存檔（優雅降級） ================= */
const SAVE_KEY="xiaotan_save_v4";
let memSave=null;
const store={
  read(){ try{ const s=localStorage.getItem(SAVE_KEY); return s?JSON.parse(s):memSave; }catch(e){ return memSave; } },
  write(o){ memSave=o; try{ localStorage.setItem(SAVE_KEY,JSON.stringify(o)); }catch(e){} },
};

/* ================= 音效 / 音樂 ================= */
let AC=null, master=null, muted=false, bgmOn=false, bgmStep=0, bgmTimer=null;
function initAudio(){ if(AC)return;
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=0.5; master.connect(AC.destination); startBGM(); }catch(e){ AC=null; } }
function tone(freq,dur,type,vol,when){ if(!AC||muted)return; type=type||"square"; vol=(vol==null?0.12:vol); when=when||0;
  const t=AC.currentTime+when, o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.03); }
function sweep(f1,f2,dur,type,vol){ if(!AC||muted)return; const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type||"sawtooth"; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol||0.12,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.03); }
const SFX={ atk(){tone(620,0.06,"square",0.07);}, hit(){tone(180,0.08,"sawtooth",0.09);},
  coin(){tone(880,0.05,"square",0.08);tone(1320,0.09,"square",0.07,0.05);}, heart(){tone(520,0.08,"triangle",0.1);tone(780,0.12,"triangle",0.09,0.07);},
  levelup(){[523,659,784,1047].forEach((f,i)=>tone(f,0.16,"square",0.11,i*0.09));}, ult(){sweep(180,900,0.35,"sawtooth",0.13);},
  hurt(){tone(120,0.16,"sawtooth",0.12);}, boss(){tone(70,0.5,"sawtooth",0.16);tone(105,0.5,"square",0.09,0.02);},
  jump(){sweep(400,720,0.12,"square",0.08);}, win(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,0.2,"triangle",0.12,i*0.12));},
  buy(){tone(700,0.06,"square",0.08);tone(1050,0.1,"square",0.07,0.05);}, dress(){tone(880,0.05,"triangle",0.08);tone(1175,0.09,"triangle",0.07,0.05);} };
const BGM_MELODY=[392,523,659,523,587,494,440,392, 523,659,784,659,587,523,494,440];
const BGM_BASS=[131,131,165,165,175,175,147,147, 131,131,165,165,175,175,147,147];
function startBGM(){ bgmOn=true;
  function step(){ if(!AC)return; if(!muted&&bgmOn){ const i=bgmStep%BGM_MELODY.length; tone(BGM_MELODY[i],0.22,"triangle",0.05); if(i%2===0)tone(BGM_BASS[i],0.32,"sine",0.06); } bgmStep++; bgmTimer=setTimeout(step,260); }
  step(); }
function toggleMute(){ muted=!muted; const b=document.getElementById("muteBtn"); if(b)b.textContent=muted?"🔇":"🔊"; if(!muted&&AC&&AC.state==="suspended"){try{AC.resume();}catch(e){}} }

/* ================= 職業 ================= */
const HEROES=[
  { id:"knight", name:"小紅劍士", role:"劍士", color:"#FF6B6B", hair:"#8B3A2E",

  { id:"mage", name:"紫喵法師", role:"法師", color:"#B18AE8", hair:"#5B3E86",

function drawFace(ctx,face,headY,headR,hair){

      ctx.fillStyle="#ff8fa3";ctx.beginPath();ctx.moveTo(-eW*0.22,my+eH*0.18);ctx.quadraticCurveTo(0,my+eH*0.42,eW*0.22,my+eH*0.18);ctx.quadraticCurveTo(0,my+eH*0.32,-eW*0.22,my+eH*0.18);ctx.fill(); }
    else if(kind==="o"){ ctx.fillStyle="#b84a63";ctx.beginPath();ctx.ellipse(0,my+eH*0.1,eW*0.24,eH*0.3,0,0,7);ctx.fill(); }

  if(face==="smile"){ arcEye(-dx);arcEye(dx);mouth("big"); }
  else if(face==="star"){ drawStar(ctx,-dx,eyeY,eW*1.15,"#ffd23f");drawStar(ctx,dx,eyeY,eW*1.15,"#ffd23f");

function drawWeapon(ctx,h,x,y,s,swing,atk,olw){

function update(){ if(!G.running)return; G.t++; const p=player,h=p.h;
  let mx=0; if(keys.ArrowLeft||keys.KeyA||T.left)mx-=1; if(keys.ArrowRight||keys.KeyD||T.right)mx+=1;
  if(mx!==0){p.dir=mx;p.vx=mx*p.spd;p.walk+=0.25;}else p.vx*=0.6;
  if((keys.Space||keys.ArrowUp||keys.KeyW||T.jump)&&p.onGround){p.vy=-11.2;p.onGround=false;SFX.jump();}
  if(keys.KeyJ||T.atk)playerAttack(); if(keys.KeyK||T.ult)playerUlt();
  p.vy+=0.62; if(p.vy>16)p.vy=16; p.x+=p.vx; p.x=Math.max(24,Math.min(WORLD_W-24,p.x));
  const ny=p.y+p.vy; let landed=false;
  for(const pl of platforms){ if(p.x>pl.x-6&&p.x<pl.x+pl.w+6&&p.vy>=0&&p.y<=pl.y+2&&ny>=pl.y){p.y=pl.y;p.vy=0;landed=true;break;} }
  if(!landed){p.y=ny;p.onGround=false;}else p.onGround=true; if(p.y>H+200)p.hp=0;
  if(p.atkCd>0)p.atkCd--; if(p.atkAnim>0)p.atkAnim-=0.08; if(p.invul>0)p.invul--; if(p.ultFx>0)p.ultFx-=0.05;
  if(G.t%18===0&&p.mp<p.mpMax){p.mp=Math.min(p.mpMax,p.mp+1);updateHud();}
  G.cam+=((p.x-W*0.42)-G.cam)*0.1; G.cam=Math.max(0,Math.min(WORLD_W-W,G.cam));
  const goal=LEVELS[G.level].killGoal;
  if(!G.bossAlive){ if(G.t%70===0)spawnMonster(); if(G.levelKills>=goal)spawnBoss(); }
  for(const m of monsters){ if(m.dead){m.r*=0.86;continue;} m.t++; if(m.hurt>0)m.hurt--; const toP=Math.sign(p.x-m.x); m.dir=toP||1;
    if(m.fly){ m.vx+=toP*0.05; m.vx=Math.max(-m.spd,Math.min(m.spd,m.vx)); m.x+=m.vx; const ty=(p.y-60)+Math.sin(m.t*0.05)*40; m.y+=(ty-m.y)*0.03; }
    else{ m.vx+=toP*0.06; m.vx*=0.9; const sp=m.spd||1.6; m.vx=Math.max(-sp,Math.min(sp,m.vx));
      m.jumpCd--; if(m.jumpCd<=0&&Math.abs(p.x-m.x)<320){m.vy=m.kind==="boss"?-11:-8;m.jumpCd=(m.kind==="boss"?50:60)+Math.random()*60;if(m.kind==="boss")m.vx=toP*4;}
      m.vy+=0.5; m.x+=m.vx; const ny2=m.y+m.vy; let ml=false;
      for(const pl of platforms){ if(m.x>pl.x-6&&m.x<pl.x+pl.w+6&&m.vy>=0&&m.y<=pl.y+2&&ny2>=pl.y){m.y=pl.y;m.vy=0;ml=true;break;} } if(!ml)m.y=ny2; }
    m.x=Math.max(20,Math.min(WORLD_W-20,m.x)); const mcy=m.kind==="boss"?m.y-m.r*0.9:m.y-m.r;
    if(p.invul<=0&&Math.hypot(m.x-p.x,mcy-(p.y-40))<m.r+22){ p.hp-=m.dmg;p.invul=45;p.vx=Math.sign(p.x-m.x)*4;p.vy=-5;spawnParts(p.x,p.y-40,"#ff6b6b",8);SFX.hurt();updateHud(); } }
  for(let i=monsters.length-1;i>=0;i--) if(monsters[i].dead&&monsters[i].r<4)monsters.splice(i,1);
  if(G.bossAlive){ const b=monsters.find(m=>m.kind==="boss"&&!m.dead); if(b)document.getElementById("bossHp").style.width=Math.max(0,b.hp/b.hpMax*100)+"%"; }
  for(const s of shots){ if(s.homing){ let best=null,bd=1e9; for(const m of monsters){ if(m.dead)continue; const cy=m.kind==="boss"?m.y-m.r*0.9:m.y-m.r; const d=Math.hypot(m.x-s.x,cy-s.y); if(d<bd){bd=d;best=m;} }
      if(best){ const cy=best.kind==="boss"?best.y-best.r*0.9:best.y-best.r; const a=Math.atan2(cy-s.y,best.x-s.x); s.vx+=Math.cos(a)*0.5;s.vy+=Math.sin(a)*0.5; const sp=Math.hypot(s.vx,s.vy); if(sp>5.2){s.vx*=5.2/sp;s.vy*=5.2/sp;} } }
    s.x+=s.vx;s.y+=s.vy;s.life--; for(const m of monsters){ if(m.dead)continue; const cy=m.kind==="boss"?m.y-m.r*0.9:m.y-m.r; if(Math.hypot(m.x-s.x,cy-s.y)<m.r+s.r){ damageMon(m,s.dmg,Math.sign(s.vx)||1); s.life=0; spawnParts(s.x,s.y,s.color,5); break; } } }
  for(let i=shots.length-1;i>=0;i--){ const s=shots[i]; if(s.life<=0||s.x<G.cam-80||s.x>G.cam+W+80||s.y>H+60)shots.splice(i,1); }
  for(const hh of hits)hh.life--; for(let i=hits.length-1;i>=0;i--) if(hits[i].life<=0)hits.splice(i,1);
  for(const d of drops){ d.vy+=0.4;d.x+=d.vx;d.y+=d.vy;d.life--; if(d.y>H-GROUND_H+8){d.y=H-GROUND_H+8;d.vy*=-0.4;d.vx*=0.7;}
    const dist=Math.hypot(d.x-p.x,d.y-(p.y-30)); if(dist<90){d.x+=(p.x-d.x)*0.18;d.y+=((p.y-30)-d.y)*0.18;}
    if(dist<26){ if(d.type==="gold"){p.gold+=d.val;document.getElementById("goldNum").textContent=p.gold;SFX.coin();} else{p.hp=Math.min(p.hpMax,p.hp+d.val);updateHud();spawnParts(p.x,p.y-40,"#ff8fb1",8);SFX.heart();} d.got=true; } }
  for(let i=drops.length-1;i>=0;i--) if(drops[i].got||drops[i].life<=0)drops.splice(i,1);
  for(const pt of parts){pt.vy+=0.25;pt.x+=pt.vx;pt.y+=pt.vy;pt.life--;} for(let i=parts.length-1;i>=0;i--) if(parts[i].life<=0)parts.splice(i,1);
  if(p.hp<=0)gameOver(); }

let curLook=null;
function draw(){ const L=LEVELS[G.level]||LEVELS[0]; ctx.clearRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,L.sky[0]);g.addColorStop(1,L.sky[1]);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  ctx.fillStyle=L.cloud; for(let i=0;i<6;i++){ const cx=((i*430-G.cam*0.2)%(WORLD_W))|0; cloud(cx,60+(i%3)*40); }
  ctx.save();ctx.translate(-G.cam,0);
  for(const pl of platforms){ if(pl.ground){ ctx.fillStyle=L.ground;ctx.fillRect(pl.x,pl.y,pl.w,GROUND_H+40); ctx.fillStyle=L.groundTop;ctx.fillRect(pl.x,pl.y,pl.w,14);

  for(const s of shots){ ctx.save(); if(s.kind==="arrow"){ ctx.translate(s.x,s.y);ctx.rotate(Math.atan2(s.vy,s.vx)); ctx.fillStyle="#8B5A2B";ctx.fillRect(-10,-1.5,20,3);ctx.fillStyle="#dfe9f2";ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(4,-4);ctx.lineTo(4,4);ctx.fill(); }
    else{ const gr=ctx.createRadialGradient(s.x,s.y,1,s.x,s.y,s.r*1.6);gr.addColorStop(0,"#fff");gr.addColorStop(.4,s.color);gr.addColorStop(1,s.color+"00"); ctx.fillStyle=gr;ctx.beginPath();ctx.arc(s.x,s.y,s.r*1.6,0,7);ctx.fill(); } ctx.restore(); }
  for(const d of drops){ if(d.type==="gold"){ ctx.fillStyle="#FFC93C";ctx.beginPath();ctx.arc(d.x,d.y,7,0,7);ctx.fill(); ctx.fillStyle="#e0a800";ctx.font="bold 8px sans-serif";ctx.textAlign="center";ctx.fillText("$",d.x,d.y+3); }
    else{ ctx.fillStyle="#ff6b8f";ctx.font="16px sans-serif";ctx.textAlign="center";ctx.fillText("❤",d.x,d.y+5); } } ctx.textAlign="start";
  for(const pt of parts){ ctx.globalAlpha=Math.max(0,pt.life/25);ctx.fillStyle=pt.color;ctx.beginPath();ctx.arc(pt.x,pt.y,3,0,7);ctx.fill(); } ctx.globalAlpha=1;
  if(player){ const p=player, blink=p.invul>0&&(G.t%8<4);
    if(p.ultFx>0){ ctx.save();ctx.globalAlpha=p.ultFx*0.5;ctx.fillStyle=p.h.color;ctx.beginPath();ctx.arc(p.x,p.y-40,60,0,7);ctx.fill();ctx.restore(); }
    if(!blink) drawHero(ctx,p.h,p.x,p.y,88,{dir:p.dir,walk:p.walk,atk:p.atkAnim,air:!p.onGround,look:curLook}); }

function drawHills(off,base,color,amp){ ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,H); for(let x=-100;x<=W+100;x+=40){ const y=base-Math.sin((x+off)*0.006)*amp*0.4-amp*0.3; ctx.lineTo(x,y); } ctx.lineTo(W,H);ctx.fill(); }

document.querySelectorAll(".tbtn").forEach(b=>{ const k=b.dataset.k; const on=e=>{e.preventDefault();T[k]=true;}, off=e=>{e.preventDefault();T[k]=false;};
  b.addEventListener("touchstart",on);b.addEventListener("touchend",off);b.addEventListener("touchcancel",off); b.addEventListener("mousedown",on);b.addEventListener("mouseup",off);b.addEventListener("mouseleave",off); });

/* ================= 存檔 ================= */
function saveGame(){ if(!player||!G.hero)return;
  store.write({ heroId:G.hero.id, name:G.heroName, custom:G.custom, owned:G.owned,
    baseHpMax:player.baseHpMax, baseMpMax:player.baseMpMax, baseAtk:player.baseAtk, spd:player.spd,
    lv:player.lv, xp:player.xp, xpNext:player.xpNext, gold:player.gold, level:G.level, bought:shopBought }); }

/* ================= 商店 ================= */
const SHOP=[
  {id:"atk", icon:"⚔️", name:"力量藥劑", desc:"攻擊力 +5", base:30, grow:1.5, buy:p=>{p.baseAtk+=5;recalcStats(p);}},
  {id:"hp",  icon:"❤️", name:"體力果實", desc:"生命上限 +30，並回滿", base:35, grow:1.5, buy:p=>{p.baseHpMax+=30;recalcStats(p);p.hp=p.hpMax;}},
  {id:"mp",  icon:"🔷", name:"魔力結晶", desc:"魔力上限 +20，並回滿", base:30, grow:1.5, buy:p=>{p.baseMpMax+=20;recalcStats(p);p.mp=p.mpMax;}},
  {id:"spd", icon:"👟", name:"疾風之靴", desc:"移動速度 +0.3", base:40, grow:1.8, buy:p=>{p.spd+=0.3;}},
  {id:"heal",icon:"🧪", name:"回復藥水", desc:"立刻回滿血與魔力", base:20, grow:1.15, buy:p=>{p.hp=p.hpMax;p.mp=p.mpMax;}},
];
const shopBought={};
function shopPrice(it){ return Math.round(it.base*Math.pow(it.grow, shopBought[it.id]||0)); }
function renderShop(){ document.getElementById("shopGold").textContent=player.gold; const box=document.getElementById("shopItems"); box.innerHTML="";
  SHOP.forEach(it=>{ const price=shopPrice(it); const row=document.createElement("div"); row.className="shop-item";
    row.innerHTML=`<div class="ic">${it.icon}</div><div class="info"><b>${it.name}</b><div>${it.desc}</div></div><button class="buy" ${player.gold<price?"disabled":""}>💰 ${price}</button>`;
    row.querySelector(".buy").addEventListener("click",()=>{ const pr=shopPrice(it); if(player.gold<pr)return; player.gold-=pr; it.buy(player); shopBought[it.id]=(shopBought[it.id]||0)+1;
      document.getElementById("goldNum").textContent=player.gold; updateHud(); saveGame(); renderShop(); spawnParts(player.x,player.y-40,"#ffd23f",10); SFX.buy(); });
    box.appendChild(row); }); }
let shopOpen=false;
function toggleShop(){ shopOpen=!shopOpen; if(shopOpen){ G.paused=true; G.running=false; renderShop(); document.getElementById("shop").style.display="flex"; }
  else { document.getElementById("shop").style.display="none"; if(!G.won){ G.paused=false; G.running=true; } } }
document.getElementById("shopBtn").addEventListener("click",toggleShop);
document.getElementById("closeShop").addEventListener("click",toggleShop);
document.getElementById("muteBtn").addEventListener("click",toggleMute);

/* ================= 裝扮台（紙娃娃） ================= */
const DRESS_TABS=[
  {id:"skin", name:"膚色"}, {id:"hair", name:"髮色"}, {id:"body", name:"服裝"},
  {id:"hat", name:"帽子"}, {id:"back", name:"背飾"}, {id:"face", name:"表情"},
];
let dressTab="hat", dressOpen=false, dressRAF=0, dressFrom="game";
const dpCtx=document.getElementById("dressPreview").getContext("2d");
function buildDressTabs(){ const box=document.getElementById("dressTabs"); box.innerHTML="";
  DRESS_TABS.forEach(t=>{ const el=document.createElement("div"); el.className="dtab"+(t.id===dressTab?" on":""); el.textContent=t.name;
    el.addEventListener("click",()=>{ dressTab=t.id; buildDressTabs(); renderDress(); }); box.appendChild(el); }); }
function currentDressHero(){ return G.hero||picked||HEROES[0]; }
function renderDress(){
  document.getElementById("dressGold").textContent=player?player.gold:0;
  const box=document.getElementById("dressOptions"); box.innerHTML=""; const c=G.custom;
  if(dressTab==="skin"||dressTab==="hair"||dressTab==="body"){
    const arr = dressTab==="skin"?SKINS : dressTab==="hair"?HAIRS : BODYCOLORS;
    arr.forEach((col,idx)=>{ const sw=document.createElement("div"); sw.className="swatch"+(c[dressTab]===idx?" on":"");
      sw.style.background = col===null ? "conic-gradient(#FF6B6B,#FFD23F,#5FC96B,#5AC8FA,#B18AE8,#FF6B6B)" : col;
      if(col===null){ sw.title="職業色"; }
      sw.addEventListener("click",()=>{ c[dressTab]=idx; afterDressChange(); }); box.appendChild(sw); }); }
  else if(dressTab==="face"){
    FACES.forEach(f=>{ const o=document.createElement("div"); o.className="opt"+(c.face===f.id?" on":"");
      o.innerHTML=`<div class="oi">${f.icon}</div><div class="on-nm">${f.name}</div>`;
      o.addEventListener("click",()=>{ c.face=f.id; afterDressChange(); }); box.appendChild(o); }); }
  else { // hat / back
    const arr = dressTab==="hat"?HATS:BACKS;
    arr.forEach(part=>{ const owned=hasPart(part.id), on=(c[dressTab]===part.id), locked=(part.cost>0&&!owned);
      const o=document.createElement("div"); o.className="opt"+(on?" on":"")+(locked&&!(player&&player.gold>=part.cost)?" locked":"");
      const bonus=[]; if(part.atk)bonus.push("攻+"+part.atk); if(part.hp)bonus.push("血+"+part.hp); if(part.mp)bonus.push("魔+"+part.mp);
      let priceHtml = part.cost===0 ? "" : (owned ? `<div class="price own">已擁有</div>` : `<div class="price">💰${part.cost}</div>`);
      o.innerHTML=`<div class="oi">${part.icon}</div><div class="on-nm">${part.name}</div>${bonus.length?`<div class="bonus">${bonus.join(" ")}</div>`:""}${priceHtml}`;
      o.addEventListener("click",()=>{
        if(locked){ const gold=player?player.gold:0; if(gold<part.cost)return; player.gold-=part.cost; G.owned.push(part.id);
          document.getElementById("goldNum").textContent=player.gold; SFX.buy(); }
        c[dressTab]=part.id; afterDressChange(); }); box.appendChild(o); }); }
}
function afterDressChange(){ refreshLook(); if(player){ recalcStats(player); updateHud(); saveGame(); } SFX.dress(); renderDress(); }
function randomizeDress(){ const c=G.custom, R=n=>(Math.random()*n)|0;
  c.skin=R(SKINS.length); c.hair=R(HAIRS.length); c.body=R(BODYCOLORS.length); c.face=FACES[R(FACES.length)].id;
  const okH=HATS.filter(p=>hasPart(p.id)); c.hat=okH[R(okH.length)].id;
  const okB=BACKS.filter(p=>hasPart(p.id)); c.back=okB[R(okB.length)].id;
  afterDressChange(); }
function dressPreviewLoop(){ if(!dressOpen)return; dpCtx.clearRect(0,0,300,300); const look=resolveLook(currentDressHero(),G.custom);
  drawHero(dpCtx,currentDressHero(),150,250,190,{dir:1,walk:performance.now?performance.now()/120:Date.now()/120,atk:0,air:false,look:look});
  dressRAF=requestAnimationFrame(dressPreviewLoop); }
function openDress(from){ dressFrom=from||"game"; dressOpen=true;
  if(from!=="pick"){ G.paused=true; G.running=false; }
  if(!G.custom) G.custom=defaultCustom(currentDressHero());
  buildDressTabs(); renderDress(); document.getElementById("dress").style.display="flex"; dressPreviewLoop(); }
function closeDress(){ dressOpen=false; if(dressRAF)cancelAnimationFrame(dressRAF); document.getElementById("dress").style.display="none";
  refreshLook(); if(dressFrom!=="pick"&&!G.won){ G.paused=false; G.running=true; } }
document.getElementById("dressBtn").addEventListener("click",()=>openDress("game"));
document.getElementById("closeDress").addEventListener("click",closeDress);
document.getElementById("dressPickBtn").addEventListener("click",()=>{ if(!picked)return; openDress("pick"); });
document.getElementById("randomDressBtn").addEventListener("click",randomizeDress);

/* ================= 選角 / 開始 ================= */
let picked=null;
function buildCards(){ const box=document.getElementById("cards");
  HEROES.forEach(h=>{ const c=document.createElement("div"); c.className="hero-card";c.style.setProperty("--c",h.color);
    c.innerHTML=`<canvas width="200" height="200"></canvas><div class="nm">${h.name}</div><div class="role">${h.role}</div><div class="desc">${h.desc}</div><div class="ult">✦ 大招：${h.ult.name}</div><div class="stats"></div>`;
    box.appendChild(c);
    const hc=c.querySelector("canvas"), hctx=hc.getContext("2d"); let ph=0;
    (function anim(){ hctx.clearRect(0,0,200,200); const lk=resolveLook(h,(picked===h&&G.custom)?G.custom:defaultCustom(h));
      drawHero(hctx,h,100,182,140,{dir:1,walk:ph,atk:0,air:false,look:lk}); ph+=0.12; requestAnimationFrame(anim); })();
    const st=c.querySelector(".stats"); Object.values(h.pips).forEach(v=>{ for(let i=0;i<3;i++){ const pp=document.createElement("i");pp.className="pip"+(i<v?" on":"");st.appendChild(pp);} });
    c.addEventListener("click",()=>{ document.querySelectorAll(".hero-card").forEach(x=>x.classList.remove("sel")); c.classList.add("sel"); picked=h;
      G.custom=defaultCustom(h); refreshLook();
      const inp=document.getElementById("heroName"); if(!inp.value)inp.value=h.name;
      document.getElementById("dressPickBtn").disabled=false;
      const s=document.getElementById("start"); s.disabled=false; s.textContent="出發冒險！ 🚀"; }); }); }
function refreshContinue(){ const sv=store.read(); const box=document.getElementById("continueBox");
  if(sv&&sv.heroId){ const hh=heroById(sv.heroId); box.style.display="flex";
    document.getElementById("contName").textContent=(sv.name||hh.name)+"（"+hh.role+"）";
    document.getElementById("contInfo").textContent="Lv "+sv.lv+"　💰"+sv.gold+"　"+LEVELS[sv.level||0].name;
    document.getElementById("newlbl").style.display="block"; }
  else{ box.style.display="none"; document.getElementById("newlbl").style.display="none"; } }
function showHUD(){ document.getElementById("pick").style.display="none"; document.getElementById("over").style.display="none";
  document.getElementById("hud").style.display="flex"; document.getElementById("topright").style.display="flex"; document.getElementById("hint").style.display="block";
  document.getElementById("muteBtn").textContent=muted?"🔇":"🔊"; if("ontouchstart" in window)document.getElementById("touch").style.display="flex";
  setTimeout(()=>{ const el=document.getElementById("hint"); if(el)el.style.display="none"; },5000); }
function beginCommon(){ G.won=false; G.paused=false; G.kills=0; G.cam=0; G.t=0; G.bossAlive=false;
  document.getElementById("goldNum").textContent=player.gold; document.getElementById("pName").textContent=G.heroName;
  refreshLook(); showHUD(); buildWorld(G.level); updateHud(); G.running=true; initAudio(); }
function startGame(){ if(!picked)return; G.hero=picked; G.heroName=(document.getElementById("heroName").value||picked.name).trim().slice(0,8)||picked.name;
  if(!G.custom)G.custom=defaultCustom(picked); for(const k in shopBought)delete shopBought[k];
  G.level=0; player=makePlayer(picked,null); enterLevelInit(0); beginCommon(); saveGame(); }
function continueGame(){ const sv=store.read(); if(!sv||!sv.heroId)return; G.hero=heroById(sv.heroId); G.heroName=sv.name||G.hero.name;
  G.custom=sv.custom||defaultCustom(G.hero); G.owned=Array.isArray(sv.owned)?sv.owned.slice():[];
  for(const k in shopBought)delete shopBought[k]; if(sv.bought)Object.assign(shopBought,sv.bought);
  G.level=sv.level||0; player=makePlayer(G.hero,sv); enterLevelInit(G.level); beginCommon(); }
function enterLevelInit(idx){ G.level=idx; G.levelKills=0; monsters.length=0;shots.length=0;hits.length=0;drops.length=0;parts.length=0; player.x=120;player.y=H-GROUND_H;
  document.getElementById("stageName").textContent=LEVELS[idx].name; document.getElementById("killGoal").textContent=LEVELS[idx].killGoal; document.getElementById("killNum").textContent=0; }
function gameOver(){ G.running=false; G.won=false; saveGame(); document.getElementById("overTitle").textContent="😵 倒下了…";
  document.getElementById("overStat").textContent=`${G.heroName}（${G.hero.role}）　等級 ${player.lv}　${LEVELS[G.level].name}　金幣 ${player.gold}`;
  document.getElementById("again").textContent="回到選單"; document.getElementById("over").style.display="flex";
  document.getElementById("hud").style.display="none"; document.getElementById("topright").style.display="none"; document.getElementById("bossbar").style.display="none"; }
function victory(){ G.running=false; G.won=true; SFX.win(); G.level=0; saveGame();
  document.getElementById("overTitle").textContent="🏆 通關蕭貪島！";
  document.getElementById("overStat").textContent=`${G.heroName} 打倒了蕭貪魔王！等級 ${player.lv}　金幣 ${player.gold}。可帶著養成再挑戰更強循環！`;
  document.getElementById("again").textContent="回到選單"; document.getElementById("over").style.display="flex";
  document.getElementById("hud").style.display="none"; document.getElementById("topright").style.display="none"; document.getElementById("bossbar").style.display="none"; }
document.getElementById("start").addEventListener("click",startGame);
document.getElementById("continueBtn").addEventListener("click",continueGame);
document.getElementById("again").addEventListener("click",()=>{ document.getElementById("over").style.display="none"; document.getElementById("pick").style.display="flex"; refreshContinue(); });

/* ================= 啟動 ================= */
resize(); buildWorld(0); buildCards(); refreshContinue(); loop();
</script>
</body>
</html>
